{% extends "base.html" %}{% block title %}Users{% endblock %}{% block body %}
<h1>Users and roles</h1><table class="grid"><tr><th>Name</th><th>Username</th><th>Role</th></tr>
{% for r in rows %}<tr><td>{{ r.name }}</td><td>{{ r.username }}</td><td><span class="tag">{{ r.role }}</span></td></tr>{% endfor %}</table>
<h2>Add a user</h2><form method="post" class="stack"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>Full name<input name="name"></label><label>Username<input name="username" required></label>
<label>Role<select name="role">{% for r in roles %}<option>{{ r }}</option>{% endfor %}</select></label>
<label>Password (8+ characters)<input name="password" type="password" minlength="8" required></label><button>Create user</button></form>{% endblock %}
